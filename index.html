<body>
  <div class="topbar">

  <div id="fullscreen-player">
    <div class="slit-scan-container">
      <video id="mainPlayer" autoplay muted playsinline preload="auto" crossorigin="anonymous" style="width: 100%; height: 100%; object-fit: cover; display: block;"></video>
    </div>
    <div class="player-controls">
      <div class="controls-row">
        <button id="pausePlayBtn" class="circle-btn pause-play-btn" aria-label="Pause/Play">
          <svg viewBox="0 0 24 24" fill="none" stroke="none">
            <path class="play-icon" d="M5 3l14 9-14 9V3z" fill="white" stroke="none"></path>
            <path class="pause-icon" style="display:none" d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" fill="white" stroke="none"></path>
          </svg>
        </button>
        <button id="discoverBtn" class="discover-btn" aria-label="Discover Hong Kong">
          <img src="assets/Discover Hong Kong.png" alt="Discover Hong Kong" />
        </button>
        <button id="screenshotBtn" class="circle-btn screenshot-btn" aria-label="Screenshot">
          <svg viewBox="0 0 24 24" fill="none" stroke="none">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" fill="white" stroke="white"></path>
            <circle cx="12" cy="13" r="4" fill="transparent" stroke="white" stroke-width="2"></circle>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="canvas-container"></div>

  <div id="title-wrap">
    <img id="title-overlay" src="assets/Title White.png" alt="City of Fragments" />
    <a id="overlay-subtitle" class="subtitle overlay-subtitle" href="#" aria-hidden="true">Location: West Kowloon Art Park</a>
  </div>

  <audio id="ambientAudio" loop>
    <source src="assets/253461__odranreb__tai-ping-shan-ambient.mp3" type="audio/mpeg">
  </audio>

  <script src="slit-scan.js?v=2025-12-09-fix"></script>
  <script>
    (() => {
      const tutorialKey = 'slitTutorialShown';
      const tutorialShown = () => localStorage.getItem(tutorialKey) === '1';
      const markTutorialShown = () => localStorage.setItem(tutorialKey, '1');

      function createTutorialModal(onSave, onContinue) {
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;';

        const box = document.createElement('div');
        box.style.cssText = 'background:#fff;border-radius:12px;max-width:420px;width:90%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,0.25);text-align:center;color:#111;font-family:Helvetica,Arial,sans-serif;';
        box.innerHTML = '<h2 style="margin:0 0 10px;font-size:20px;">Save your scan</h2><p style="margin:0 0 16px;font-size:14px;line-height:1.5;color:#444;">Your slit-scan is ready. Save it as an image or continue watching.</p>';

        const btnRow = document.createElement('div');
        btnRow.style.cssText = 'display:flex;gap:10px;justify-content:center;margin-top:8px;';

        const saveBtn = document.createElement('button');
        saveBtn.textContent = 'Save image';
        saveBtn.style.cssText = 'padding:10px 14px;border:none;border-radius:8px;background:#111;color:#fff;cursor:pointer;font-weight:600;';
        saveBtn.addEventListener('click', () => onSave?.());

        const contBtn = document.createElement('button');
        contBtn.textContent = 'Continue';
        contBtn.style.cssText = 'padding:10px 14px;border:1px solid #111;border-radius:8px;background:#fff;color:#111;cursor:pointer;font-weight:600;';
        contBtn.addEventListener('click', () => onContinue?.());

        btnRow.appendChild(saveBtn);
        btnRow.appendChild(contBtn);
        box.appendChild(btnRow);
        overlay.appendChild(box);

        return overlay;
      }

      function captureScreenshot(player) {
        const container = player.parentElement;
        const slitCanvas = container.querySelector('.slit-scan-canvas');

        if (!slitCanvas || slitCanvas.width === 0 || slitCanvas.height === 0) {
          console.warn('Slit-scan canvas not ready');
          return;
        }

        const canvas = document.createElement('canvas');
        canvas.width = slitCanvas.width;
        canvas.height = slitCanvas.height;
        const ctx = canvas.getContext('2d');

        ctx.drawImage(player, 0, 0, canvas.width, canvas.height);
        ctx.drawImage(slitCanvas, 0, 0);

        canvas.toBlob((blob) => {
          if (blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `city-fragments-${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }
        }, 'image/jpeg', 0.95);
      }

      const sources = [
        'assets/1.mp4', 'assets/2.mp4', 'assets/3.mp4', 'assets/4.mp4', 'assets/5.mp4',
        'assets/6.mp4', 'assets/7.mp4', 'assets/8.mp4', 'assets/9.mp4', 'assets/10.mp4',
        'assets/11.mp4', 'assets/12.mp4'
      ];

      const videoLocations = {
        'assets/1.mp4': 'Location: Portland Street, Mong Kok',
        'assets/2.mp4': 'Location: West Kowloon Art Park',
        'assets/3.mp4': 'Location: Red Incense Burner Summit',
        'assets/4.mp4': 'Location: Lugard Road, The Peak',
        'assets/5.mp4': 'Location: Footbridge KF38, Ngau Tau Kok',
        'assets/6.mp4': 'Location: Wan Sha Street, Tai Hang',
        'assets/7.mp4': 'Location: Hung Hom',
        'assets/8.mp4': 'Location: Cheung Wing Restaurant, Ngau Tau Kok',
        'assets/9.mp4': 'Location: Yau Ma Tei Wholesale Fruit Market',
        'assets/10.mp4': 'Location: Yau Ma Tei Wholesale Fruit Market',
        'assets/11.mp4': 'Location: Fung Wong Sun Tsuen',
        'assets/12.mp4': 'Location: Lung Fu Shan Morning Trail'
      };

      const videoScanTypes = {
        'assets/1.mp4': 'fixed-vertical',
        'assets/2.mp4': 'moving-vertical',
        'assets/3.mp4': 'fixed-vertical',
        'assets/4.mp4': 'fixed-horizontal',
        'assets/5.mp4': 'moving-horizontal',
        'assets/6.mp4': 'fixed-vertical',
        'assets/7.mp4': 'fixed-horizontal',
        'assets/8.mp4': 'moving-vertical',
        'assets/9.mp4': 'moving-horizontal-utd',
        'assets/10.mp4': 'fixed-vertical',
        'assets/11.mp4': 'fixed-vertical',
        'assets/12.mp4': 'fixed-vertical'
      };

      function initializeAll() {
        const player = document.getElementById('mainPlayer');
        const moreBtn = document.getElementById('discoverBtn');
        const pausePlayBtn = document.getElementById('pausePlayBtn');
        const screenshotBtn = document.getElementById('screenshotBtn');
        const ambientAudio = document.getElementById('ambientAudio');

        if (!player) {
          console.error('Player not found');
          return;
        }
        
        // Start ambient audio
        if (ambientAudio) {
          ambientAudio.volume = 0.3; // Set volume to 30%
          ambientAudio.play().catch(e => {
            console.log('Autoplay blocked, will play on user interaction');
            // Try to play on first user interaction
            const playAudio = () => {
              ambientAudio.play();
              document.removeEventListener('click', playAudio);
              document.removeEventListener('touchstart', playAudio);
            };
            document.addEventListener('click', playAudio, { once: true });
            document.addEventListener('touchstart', playAudio, { once: true });
          });
        }

        let currentIndex = 0;

        function setVideo(index) {
          currentIndex = ((index % sources.length) + sources.length) % sources.length;
          const src = sources[currentIndex];

          player.muted = true;
          player.playsInline = true;
          player.loop = tutorialShown();
          player.src = src;
          player.load();

          if (window.SlitScan) {
            const scanType = videoScanTypes[src] || 'fixed-vertical';
            if (!player._slitScan) {
              window.SlitScan.attachTo(player, { scanWidth: 10, dx: 3, scanType });
              console.log('Slit-scan attached with type:', scanType);
            } else {
              // Clear accumulated trails when switching videos
              if (player._slitScan.capturedSlices) {
                player._slitScan.capturedSlices = [];
              }
              if (player._slitScan.ctx && player._slitScan.canvas) {
                player._slitScan.ctx.clearRect(0, 0, player._slitScan.canvas.width, player._slitScan.canvas.height);
              }
              player._slitScan.scanType = scanType;
              player._slitScan.scanWidth = 10;
              player._slitScan.dx = 3;
              console.log('Slit-scan updated to type:', scanType);
            }
          } else {
            console.error('SlitScan module not loaded!');
          }

          const subtitle = document.getElementById('overlay-subtitle');
          if (subtitle && videoLocations[src]) {
            subtitle.textContent = videoLocations[src];
          }

          const playVideo = () => {
            player.play().catch(e => console.warn('Autoplay blocked:', e));
          };

          if (player.readyState >= 2) {
            playVideo();
          } else {
            player.addEventListener('loadeddata', playVideo, { once: true });
          }
        }

        setVideo(0);

        if (moreBtn) {
          moreBtn.addEventListener('click', (ev) => {
            ev.preventDefault();
            setVideo(currentIndex + 1);
          });
        }

        if (pausePlayBtn) {
          pausePlayBtn.addEventListener('click', () => {
            if (player.paused) {
              player.play();
              pausePlayBtn.querySelector('.play-icon').style.display = 'none';
              pausePlayBtn.querySelector('.pause-icon').style.display = 'block';
            } else {
              player.pause();
              pausePlayBtn.querySelector('.play-icon').style.display = 'block';
              pausePlayBtn.querySelector('.pause-icon').style.display = 'none';
            }
          });

          pausePlayBtn.querySelector('.play-icon').style.display = 'none';
          pausePlayBtn.querySelector('.pause-icon').style.display = 'block';
        }

          if (screenshotBtn) {
            screenshotBtn.addEventListener('click', () => {
              captureScreenshot(player);
            });
          }

          // Handle tutorial on first loop end
          player.addEventListener('ended', () => {
            if (!player._slitScan) return;

            if (!tutorialShown()) {
              player.pause();
              const modal = createTutorialModal(
                () => {
                  captureScreenshot(player);
                  player._slitScan.clearAccumulation();
                  markTutorialShown();
                  player.loop = true;
                  document.body.removeChild(modal);
                  player.currentTime = 0;
                  player.play();
                },
                () => {
                  player._slitScan.clearAccumulation();
                  markTutorialShown();
                  player.loop = true;
                  document.body.removeChild(modal);
                  player.currentTime = 0;
                  player.play();
                }
              );
              document.body.appendChild(modal);
            } else {
              // For subsequent loops, seamlessly restart
              player.currentTime = 0;
              player.play();
            }
          });

          // Seamless loop helper to avoid black frames once tutorial is done
          const seamlessLoop = () => {
            if (!tutorialShown()) return; // allow first-time pause for tutorial
            if (player.duration && (player.duration - player.currentTime) < 0.06) {
              player.currentTime = 0;
              player.play().catch(() => {});
            }
          };
          player.addEventListener('timeupdate', seamlessLoop);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initializeAll);
        } else {
          initializeAll();
        }
      })();
  </script>

  <script src="sketch.js"></script>
</body>
