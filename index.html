<script>
(function () {
  const player = document.getElementById('mainPlayer');
  const discoverBtn = document.getElementById('discoverBtn');

  // List of all videos
  const sources = [
    'assets/IMG_8770.MP4',
    'assets/IMG_8991.MP4',
    'assets/IMG_8910.MP4',
    'assets/IMG_8805.MP4',
    'assets/IMG_7414.MP4',
    'assets/IMG_2723.MP4',
    'assets/IMG_6021.MP4',
    'assets/IMG_5619.MP4',
    'assets/IMG_5193.MP4',
    'assets/IMG_8758.MP4'
  ];

  let currentIndex = 0;

  // --- Preload all videos in hidden elements ---
  const preloadVideos = sources.map(src => {
    const vid = document.createElement('video');
    vid.src = src;
    vid.preload = 'auto';
    vid.muted = true;
    vid.playsInline = true;
    vid.style.display = 'none';
    document.body.appendChild(vid);
    return vid;
  });

  // --- Function to switch videos reliably ---
  function switchVideo(index) {
    currentIndex = (index + sources.length) % sources.length;
    const src = sources[currentIndex];

    player.pause();       // stop current video
    player.muted = true;  // ensure autoplay
    player.src = src;
    player.load();

    // play when ready
    player.addEventListener('canplay', function playHandler() {
      player.play().catch(() => {
        console.warn('Autoplay blocked, waiting for user click.');
        showPlayOverlay();
      });
      player.removeEventListener('canplay', playHandler);
    });
  }

  // --- Overlay button fallback if autoplay blocked ---
  function showPlayOverlay() {
    if (document.getElementById('playOverlay')) return; // already exists
    const btn = document.createElement('button');
    btn.id = 'playOverlay';
    btn.innerText = 'Click to Play';
    btn.style.position = 'absolute';
    btn.style.top = '50%';
    btn.style.left = '50%';
    btn.style.transform = 'translate(-50%, -50%)';
    btn.style.padding = '1em 2em';
    btn.style.zIndex = 1000;
    btn.style.fontSize = '1.2rem';
    btn.style.cursor = 'pointer';
    btn.addEventListener('click', () => {
      player.play().catch(() => {});
      btn.remove();
    });
    document.body.appendChild(btn);
  }

  // --- Discover button ---
  if (discoverBtn) {
    discoverBtn.addEventListener('click', (e) => {
      e.preventDefault();
      switchVideo(currentIndex + 1);
    });

    discoverBtn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        discoverBtn.click();
      }
    });
  }

  // --- Responsive fullscreen ---
  function fitVideo() {
    if (!player) return;
    player.style.position = 'absolute';
    player.style.left = '50%';
    player.style.top = '50%';
    player.style.transform = 'translate(-50%, -50%)';
    player.style.width = '100%';
    player.style.height = '100%';
    player.style.objectFit = 'cover';
  }
  window.addEventListener('resize', fitVideo);
  player.addEventListener('loadedmetadata', fitVideo);
  setTimeout(fitVideo, 100);

  // --- Initialize first video ---
  switchVideo(0);
})();
</script>
