<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>City of Fragments</title>
  <link rel="stylesheet" href="style.css" />
  <!-- p5.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>

<body>
  <div class="topbar">
    <a class="top-link left" href="PROJECTINTRO.html">PROJECT INTRO</a>
    <a class="top-link right" href="people.html">PEOPLE</a>
  </div>

  <div id="fullscreen-player">
    <video id="mainPlayer" autoplay muted playsinline loop preload="auto">
      <source src="assets/IMG_9639.MP4" type="video/mp4">
    </video>
    <div class="player-controls">
      <button id="discoverBtn" class="discover-btn" aria-label="Discover Hong Kong">
        <img src="assets/Discover Hong Kong.png" alt="Discover Hong Kong" />
      </button>
    </div>
  </div>

  <!-- Canvas container for p5.js orb -->
  <div id="canvas-container"></div>

  <!-- Title overlay -->
  <div id="title-wrap">
    <img id="title-overlay" src="assets/Title White.png" alt="City of Fragments" />
    <a id="overlay-subtitle" class="subtitle overlay-subtitle" href="#" aria-hidden="true">
      The city is no longer a place we inhabit — it’s a place we remember.
    </a>
  </div>

  <!-- Floating Add button -->
  <button id="addBtn" title="Discover Hong Kong">+</button>

  <footer class="site-footer">
    <a class="bottom-link left" href="documentation.html">DOCUMENTATION</a>
    <div class="center small-caption"></div>
    <a class="bottom-link right" href="follow.html">FOLLOW</a>
  </footer>

  <script>
(function () {
  const player = document.getElementById('mainPlayer');
  const discoverBtn = document.getElementById('discoverBtn');

  // Plain array of video URLs
  const sources = [
    'assets/IMG_2723.MP4',
    'assets/IMG_5193.MP4',
    'assets/IMG_5619.MP4',
    'assets/IMG_6021.MP4',
    'assets/IMG_7414.MP4',
    'assets/IMG_8758.MP4',
    'assets/IMG_8766.MP4',
    'assets/IMG_8805.MP4',
    'assets/IMG_8910.MP4',
    'assets/IMG_8991.MP4',
    'assets/IMG_9319.MP4',
    'assets/IMG_9639.MP4'
  ];

  let currentIndex = 0;

  function switchVideo(index) {
    currentIndex = (index + sources.length) % sources.length;
    const src = sources[currentIndex];

    player.pause();
    player.src = src;
    player.load();
    player.muted = true;

    // Ensure smooth playback after buffering
    player.addEventListener('canplaythrough', function playHandler() {
      player.play().catch(() => {
        console.warn('Autoplay blocked, user interaction required.');
      });
      player.removeEventListener('canplaythrough', playHandler);
    });
  }

  if (discoverBtn) {
    discoverBtn.addEventListener('click', (e) => {
      e.preventDefault();
      switchVideo(currentIndex + 1);
    });

    discoverBtn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        discoverBtn.click();
      }
    });
  }

  // Fit video in fullscreen
  function fitVideo() {
    player.style.position = 'absolute';
    player.style.left = '50%';
    player.style.top = '50%';
    player.style.transform = 'translate(-50%, -50%)';
    player.style.width = '100%';
    player.style.height = '100%';
    player.style.objectFit = 'cover';
  }
  window.addEventListener('resize', fitVideo);
  player.addEventListener('loadedmetadata', fitVideo);
  setTimeout(fitVideo, 100);

  // Initialize first video
  switchVideo(0);
})();
</script>

  <script src="sketch.js"></script>
</body>

</html>
