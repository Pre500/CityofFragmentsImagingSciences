  <script>
    // Prevent video upscaling: size hero video to intrinsic resolution when smaller than its container
    (function() {
      const vid = document.getElementById('heroVideo');
      if (!vid) return;
      const container = vid.closest('.frame-grid') || vid.parentElement;


      function fitVideo() {
        const vw = vid.videoWidth || vid.naturalWidth || 0;
        const vh = vid.videoHeight || vid.naturalHeight || 0;
        const cw = container.clientWidth;
        const ch = container.clientHeight;


        // reset positioning so we can center
        vid.style.position = 'absolute';
        vid.style.left = '50%';
        vid.style.top = '50%';
        vid.style.transform = 'translate(-50%, -50%)';


        if (vw && vh) {
          // If the intrinsic video size is smaller than container, don't upscale: use intrinsic width.
          if (vw <= cw && vh <= ch) {
            vid.style.width = vw + 'px';
            vid.style.height = 'auto';
            vid.style.objectFit = 'none';
          } else {
            // otherwise fit inside container while preserving aspect ratio
            vid.style.width = '100%';
            vid.style.height = '100%';
            vid.style.objectFit = 'contain';
          }
        } else {
          // fallback: ensure contain
          vid.style.width = '100%';
          vid.style.height = '100%';
          vid.style.objectFit = 'contain';
        }
      }


      vid.addEventListener('loadedmetadata', fitVideo);
      window.addEventListener('resize', fitVideo);
      // try to run once in case metadata already available
      setTimeout(fitVideo, 150);
    })();
  </script>


  <!-- Initialize videos inside frame-grid elements that have a `data-video` attribute -->
  <script>
    (async function () {
      // find all frame-grid elements with a data-video attribute
      const frames = document.querySelectorAll('.frame-grid[data-video]');
      frames.forEach(async (frame) => {
        const src = frame.getAttribute('data-video');
        if (!src) return;


        // quick HEAD request to check file existence when served over http
        let exists = true;
        try {
          const resp = await fetch(src, { method: 'HEAD' });
          exists = resp && resp.ok;
        } catch (e) {
          exists = true; // if fetch fails (eg file://) try to create video anyway
        }


        if (!exists) {
          frame.classList.add('video-missing');
          frame.innerHTML = '<div class="missing-label">Video missing<br>add file to assets/</div>';
          return;
        }


        // create video element with explicit properties
        const vid = document.createElement('video');
        vid.playsInline = true;
        vid.muted = true;
        vid.autoplay = true;
        vid.loop = true;
        vid.preload = 'auto';
        vid.style.display = 'block';
        vid.style.width = '100%';
        vid.style.height = '100%';
        vid.style.objectFit = 'cover';


        // source element
        const source = document.createElement('source');
        source.src = src;
        source.type = 'video/mp4';
        vid.appendChild(source);


        // add a class so CSS can remove padding/overlay
        frame.classList.add('has-video');
        // replace the inner content (if any) with the video
        frame.innerHTML = '';
        frame.appendChild(vid);


        // playback handling with helpful fallbacks
        vid.addEventListener('canplay', () => {
          // try to play; modern browsers return a promise
          const p = vid.play();
          if (p && p.catch) p.catch(() => {
            // if autoplay was blocked, show a play overlay
            showPlayOverlay(frame, vid);
          });
        });


        vid.addEventListener('play', () => frame.classList.add('is-playing'));
        vid.addEventListener('error', () => {
          frame.classList.remove('has-video');
          frame.classList.add('video-missing');
          frame.innerHTML = '<div class="missing-label">Video failed to load</div>';
        });


        // helper to show a click overlay to start playback when autoplay blocked
        function showPlayOverlay(frameEl, videoEl) {
          const btn = document.createElement('button');
          btn.className = 'video-play-overlay';
          btn.innerText = 'Play';
          btn.addEventListener('click', () => {
            videoEl.muted = false; // let user unmute if desired
            videoEl.play().catch(()=>{});
            btn.remove();
          });
          frameEl.appendChild(btn);
        }
      });
    })();
  </script>


  <!-- p5 sketch is loaded at the end of the document -->
  
  <script>
    (async function () {
      const moreBtn = document.getElementById('discoverBtn');
      const player = document.getElementById('mainPlayer');
      const status = document.getElementById('videoStatus');
      console.log('video switcher init', { moreBtnExists: !!moreBtn, playerExists: !!player, statusExists: !!status });
      
      // Dynamically build list of MP4 files by scanning frame-grid elements with data-video attribute
      // plus the hero video, to ensure all videos in the mini-site are included
      let sources = [];
      
      // Add hero video first
      const heroVid = document.getElementById('heroVideo');
      if (heroVid && heroVid.querySelector('source')) {
        sources.push(heroVid.querySelector('source').src);
      }
      
      // Add all videos from data-video attributes in frame-grid elements
      document.querySelectorAll('.frame-grid[data-video]').forEach(frame => {
        const src = frame.getAttribute('data-video');
        if (src && !sources.includes(src)) {
          sources.push(src);
        }
      });
      
      // Fallback: if no videos found, use original hardcoded list
      if (sources.length === 0) {
        // fallback list: only include files that are present in the assets folder
        sources = [
          'assets/IMG_2723.MP4',
          'assets/IMG_5193.MP4',
          'assets/IMG_5619.MP4',
          'assets/IMG_6021.MP4',
          'assets/IMG_6424.MP4',
          'assets/IMG_7113.MP4',
          'assets/IMG_7414.MP4',
          'assets/IMG_8758.MP4',
          'assets/IMG_8766.MP4',
          'assets/IMG_8805.MP4',
          'assets/IMG_8910.MP4',
          'assets/IMG_8991.MP4',
          'assets/IMG_9147.MP4',
          'assets/IMG_9639.MP4'        
        ];

        // validate that each fallback source actually exists (HEAD request)
        async function validateSources(list) {
          const validated = [];
          await Promise.all(list.map(async (src) => {
            try {
              const resp = await fetch(src, { method: 'HEAD' });
              if (resp && resp.ok) validated.push(src);
              else console.warn('Video unavailable (will skip):', src, resp && resp.status);
            } catch (e) {
              console.warn('Error checking video (will skip):', src, e);
            }
          }));
          return validated;
        }

        sources = await validateSources(sources);
        if (sources.length === 0) console.warn('No valid fallback videos found.');
      }


      let currentIndex = 0;


      // helper: update on-screen status (useful for debugging/UX)
      function updateStatus() {
        if (!status) return;
        status.textContent = `Video ${currentIndex + 1} / ${sources.length}`;
      }


      // robust source swapping: set video src directly, load and play
      function setSourceIndex(i) {
        if (!player) return;
        if (!sources || sources.length === 0) return;
        currentIndex = ((i % sources.length) + sources.length) % sources.length;
        const src = sources[currentIndex];
        console.log('Switching main player to', src);

        try {
          // ensure player properties
          player.muted = true;
          player.playsInline = true;
          player.loop = true;

          // set src directly (simpler and more reliable than creating <source> nodes)
          if (player.src !== src) {
            player.pause();
            // remove child sources for cleanliness
            while (player.firstChild) player.removeChild(player.firstChild);
            player.removeAttribute('src');
            player.src = src;
          }

          // reset and try to play
          player.load();
          player.currentTime = 0;
          const p = player.play();
          if (p && p.catch) p.catch((err) => {
            console.warn('Autoplay prevented or play() rejected for', src, err);
            // Leave player ready; user can manually start playback if needed
          });
        } catch (err) {
          console.error('Error while switching video:', err);
        }

        updateStatus();
      }



      // initialize player with the original hero subvideo
      setSourceIndex(0);


      // ensure player will loop in the background
      try { player.loop = true; player.muted = true; player.playsInline = true; } catch(e) {}


      function cycleNext() {
        setSourceIndex(currentIndex + 1);
      }


      if (moreBtn) {
        // click handler
        moreBtn.addEventListener('click', (ev) => {
          ev.preventDefault();
          console.log('discoverBtn clicked — cycling video');
          cycleNext();
          try {
            player.currentTime = 0;
            player.muted = true;
            const p = player.play();
            if (p && p.catch) p.catch(err => console.warn('play() rejected after click:', err));
          } catch (err) { console.warn('Error while attempting play on click', err); }
        });


        // keyboard support: Enter or Space triggers the same action
        moreBtn.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
            ev.preventDefault();
            moreBtn.click();
          }
        });
      }


      // log playback errors to console and show on status
      if (player) {
        player.addEventListener('error', (e) => {
          console.error('Main player error', e);
          if (status) status.textContent = 'Video failed to load';
        });
      }
    })();
  </script>
