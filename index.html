<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>City of Fragments</title>
  <link rel="stylesheet" href="style.css" />

  <!-- p5.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <style>
    /* --- Top bar links --- */
    .topbar {
      position: absolute;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 1em 2em;
      z-index: 1000;
    }

    .top-link {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* --- Fullscreen video player --- */
    #fullscreen-player {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    #mainPlayer {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    /* --- Discover button matching main title --- */
    .discover-btn {
      width: 300px; /* adjust to match title visually */
      height: 100px;
      border: none;
      background: transparent;
      cursor: pointer;
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
    }

    .discover-btn img {
      width: 300%;
      height: 100%;
      object-fit: contain;
    }

    /* --- Title overlay --- */
    #title-wrap {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 1000;
    }

    #title-overlay {
      width: 300px;
      height: auto;
    }

    .overlay-subtitle {
      display: block;
      margin-top: 0.5em;
      color: #fff;
      font-size: 1rem;
    }

    /* --- Floating Add button --- */
    #addBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.8);
      font-size: 2rem;
      cursor: pointer;
      z-index: 1000;
    }

    /* --- Footer --- */
    .site-footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 1em 2em;
      color: #fff;
      font-size: 0.9rem;
      z-index: 1000;
    }

    .bottom-link {
      color: #fff;
      text-decoration: none;
    }

    /* --- Canvas container --- */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 500;
    }
  </style>
</head>

<body>
  <!-- Top small bar -->
  <div class="topbar">
    <a class="top-link left" href="PROJECTINTRO.html">PROJECT INTRO</a>
    <a class="top-link right" href="people.html">PEOPLE</a>
  </div>

  <!-- Fullscreen video player -->
  <div id="fullscreen-player">
    <video id="mainPlayer" autoplay muted playsinline loop preload="auto"></video>
    <button id="discoverBtn" class="discover-btn" aria-label="Discover Hong Kong">
      <img src="assets/Discover Hong Kong.png" alt="Discover Hong Kong" />
    </button>
  </div>

  <!-- Canvas container for p5.js orb -->
  <div id="canvas-container"></div>

  <!-- Title overlay -->
  <div id="title-wrap">
    <img id="title-overlay" src="assets/Title White.png" alt="City of Fragments" />
    <a id="overlay-subtitle" class="subtitle overlay-subtitle" href="#" aria-hidden="true">
      The city is no longer a place we inhabit — it’s a place we remember.
    </a>
  </div>

  <!-- Floating Add button -->
  <button id="addBtn" title="Add Content">+</button>

  <!-- Footer -->
  <footer class="site-footer">
    <a class="bottom-link left" href="documentation.html">DOCUMENTATION</a>
    <div class="center small-caption"></div>
    <a class="bottom-link right" href="follow.html">FOLLOW</a>
  </footer>

  <script>
    // --- Add button ---
    document.getElementById('addBtn').addEventListener('click', () => {
      alert('Add page / upload UI will open here.');
    });

    // --- Video management ---
    const mainPlayer = document.getElementById('mainPlayer');
    const discoverBtn = document.getElementById('discoverBtn');

    let videoSources = [
      'assets/IMG_8991.MP4',
      'assets/IMG_8910.MP4',
      'assets/IMG_8805.MP4',
      'assets/IMG_7414.MP4',
      'assets/IMG_2723.MP4',
      'assets/IMG_6021.MP4',
      'assets/IMG_5619.MP4',
      'assets/IMG_5193.MP4',
      'assets/IMG_8758.MP4',
      'assets/IMG_8766.MP4',
      'assets/IMG_9319.MP4',
      'assets/IMG_9639.MP4'
    ];

    let preloadedBlobs = [];
    let currentIndex = 0;

    async function preloadVideos() {
      for (const src of videoSources) {
        try {
          const response = await fetch(src);
          if (!response.ok) throw new Error('HTTP error ' + response.status);
          const blob = await response.blob();
          preloadedBlobs.push(URL.createObjectURL(blob));
        } catch (e) {
          console.warn('Failed to preload:', src, e);
        }
      }
    }

    function switchVideo(index) {
      if (preloadedBlobs.length === 0) return;

      currentIndex = (index + preloadedBlobs.length) % preloadedBlobs.length;
      mainPlayer.src = preloadedBlobs[currentIndex];
      mainPlayer.load();
      mainPlayer.muted = true;
      mainPlayer.play().catch(() => showPlayOverlay());
    }

    function showPlayOverlay() {
      if (document.getElementById('playOverlay')) return;
      const btn = document.createElement('button');
      btn.id = 'playOverlay';
      btn.innerText = 'Click to Play';
      Object.assign(btn.style, {
        position: 'absolute',
        top: '50%',
        left: '50%',
        transform: 'translate(-50%, -50%)',
        padding: '1em 2em',
        zIndex: 2000,
        fontSize: '1.2rem',
        cursor: 'pointer'
      });
      btn.addEventListener('click', () => {
        mainPlayer.play().catch(() => {});
        btn.remove();
      });
      document.body.appendChild(btn);
    }

    // Fit video fullscreen
    function fitVideo() {
      mainPlayer.style.position = 'absolute';
      mainPlayer.style.left = '50%';
      mainPlayer.style.top = '50%';
      mainPlayer.style.transform = 'translate(-50%, -50%)';
      mainPlayer.style.width = '100%';
      mainPlayer.style.height = '100%';
      mainPlayer.style.objectFit = 'cover';
    }

    window.addEventListener('resize', fitVideo);
    mainPlayer.addEventListener('loadedmetadata', fitVideo);
    setTimeout(fitVideo, 100);

    // Initialize
    preloadVideos().then(() => switchVideo(0));

    // Discover button click
    discoverBtn.addEventListener('click', () => switchVideo(currentIndex + 1));
  </script>

  <!-- p5.js sketch for mouse-following orb -->
  <script>
    let orb;

    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-container');
      orb = { x: width / 2, y: height / 2, size: 50 };
      noStroke();
      fill(255, 255, 255, 150);
    }

    function draw() {
      clear(); // transparent background
      // Smooth follow
      orb.x += (mouseX - orb.x) * 0.1;
      orb.y += (mouseY - orb.y) * 0.1;
      ellipse(orb.x, orb.y, orb.size);
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>

</body>

</html>
